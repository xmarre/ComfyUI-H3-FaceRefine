name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-contract-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest numpy ruff 'packaging==25.0' 'tomli==2.2.1; python_version < "3.11"'

      - name: Validate project metadata and release archive
        shell: bash
        run: |
          version="$(python - <<'PY'
          import pathlib

          from packaging.version import InvalidVersion, Version

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          raw = project["project"]["version"]
          try:
              parsed = Version(raw)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 project version: {raw!r}: {exc}") from exc
          if len(parsed.release) != 3:
              raise SystemExit(
                  f"Project version must have exactly three release components: {raw!r}"
              )
          if project["tool"]["comfy"]["PublisherId"] != "xmarre":
              raise SystemExit("Comfy Registry PublisherId must be xmarre for this fork")
          expected_repo = "https://github.com/xmarre/ComfyUI-H3-FaceRefine"
          if project["project"]["urls"]["Repository"] != expected_repo:
              raise SystemExit("project Repository URL does not point at the xmarre fork")
          print(parsed)
          PY
          )"

          archive="/tmp/ComfyUI-H3-FaceRefine-v${version}.zip"
          git archive \
            --format=zip \
            --prefix="ComfyUI-H3-FaceRefine-v${version}/" \
            --output="${archive}" \
            HEAD

          ARCHIVE="${archive}" VERSION="${version}" python - <<'PY'
          import os
          import zipfile

          prefix = f"ComfyUI-H3-FaceRefine-v{os.environ['VERSION']}/"
          required = {
              prefix + "__init__.py",
              prefix + "pyproject.toml",
              prefix + "README.md",
              prefix + "requirements.txt",
              prefix + "nodes.py",
              prefix + "continuum_refine.py",
              prefix + "quality_fixes.py",
              prefix + "quality_fixes_v2.py",
              prefix + "docs/H3_CONTINUUM_WORKFLOW_FRAGMENT.md",
          }
          with zipfile.ZipFile(os.environ["ARCHIVE"]) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"release archive is missing required files: {missing}")
          PY

      - name: Run targeted Ruff checks
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run CPU contract tests
        run: python -m pytest -q -p no:cacheprovider
